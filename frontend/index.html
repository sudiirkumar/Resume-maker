<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Resume PDF Generator</title>

    <!-- (Optional) Bumping ?v=3 to bust cache again just in case -->
    <link rel="stylesheet" href="style.css?v=3" />
    <link rel="stylesheet" href="preview.css?v=3" />

    <!-- Vercel Web Analytics -->
    <script>
        window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
    </script>
    <script defer src="/_vercel/insights/script.js"></script>
</head>

<body>
    <div id="authModal" class="modal-overlay hidden">
        <div class="modal-content">
            <div class="modal-header">
                <button id="tabLogin" class="auth-tab active">Log In</button>
                <button id="tabRegister" class="auth-tab">Sign Up</button>
            </div>

            <div class="modal-body">
                <form id="authForm" onsubmit="return false;">
                    <div class="input-group">
                        <label for="authEmail">Email Address</label>
                        <input type="email" id="authEmail" placeholder="you@example.com" required>
                    </div>

                    <div class="input-group">
                        <label for="authPassword">Password</label>
                        <input type="password" id="authPassword" placeholder="••••••••" required>
                    </div>

                    <div id="authMessage" class="auth-message hidden"></div>

                    <button type="button" id="authSubmitBtn" class="action-btn auth-submit">Log In</button>
                </form>
            </div>

            <button id="closeAuthBtn" class="close-btn">&times;</button>
        </div>
    </div>
    <div class="app-layout">
        <div class="form-panel" id="leftPanel">
            <h1>Resume Generator</h1>

            <section style="
            background: #e8f4f8;
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 8px;
            ">
                <h3 style="margin-top: 0">Upload JSON</h3>
                <input type="file" id="uploadJsonBtn" accept="application/json" style="margin-bottom: 10px" />
                <p style="font-size: 12px; color: #666; margin: 0">
                    Load previously saved resume data
                </p>
            </section>

            <button id="loadResume" class="secondary-btn" style="display:none;">Load latest resume from cloud</button>

            <form id="resumeForm">
                <section>
                    <h2>Personal Information</h2>
                    <div class="input-group">
                        <label>College Logo</label>
                        <input type="file" id="inp-logo" name="logo" accept="image/*" />
                    </div>
                    <div class="grid-2">
                        <div class="input-group">
                            <label>Full Name</label><input type="text" id="inp-name" name="name" required
                                placeholder="John Doe" />
                        </div>
                        <div class="input-group">
                            <label>Degree Specialization</label><input type="text" id="inp-degree-title"
                                name="degree_title" required placeholder="Master of Computer Applications" />
                        </div>
                        <div class="input-group">
                            <label>Gender</label>
                            <select id="inp-gender" name="gender">
                                <option value="Male">Male</option>
                                <option value="Female">Female</option>
                                <option value="Other">Other</option>
                            </select>
                        </div>
                        <div class="input-group">
                            <label>Date of Birth</label><input type="text" id="inp-dob" name="dob"
                                placeholder="07/08/2002" />
                        </div>
                        <div class="input-group">
                            <label>Email</label><input type="email" id="inp-email" name="email" required />
                        </div>
                        <div class="input-group">
                            <label>Contact Number</label><input type="text" id="inp-phone" name="phone" required />
                        </div>
                        <div class="input-group">
                            <label>Profile Picture</label><input type="file" id="inp-photo" name="photo"
                                accept="image/*" />
                        </div>
                        <div class="input-group" style="grid-column: 1 / -1;">
                            <label>Footer Details (Use Enter for new lines)</label>
                            <textarea id="inp-footer" rows="2" placeholder="Enter Footer">XXXXX XXXX XXXX
Telephone : +91-XYZ-ABCDEFG    e-mail: ab@lmno.xyz, abc.lmno@gmail.com</textarea>
                        </div>
                    </div>
                </section>

                <section>
                    <h2>Educational Qualification</h2>
                    <div id="educationList">
                        <div class="list-item">
                            <input type="text" placeholder="Year" data-field="year" class="edu-input" />
                            <input type="text" placeholder="Degree/Exam" data-field="degree" class="edu-input" />
                            <input type="text" placeholder="Institution/Board" data-field="institution"
                                class="edu-input" />
                            <input type="text" placeholder="CGPA/Percentage" data-field="score" class="edu-input" />
                        </div>
                    </div>
                    <button type="button" class="add-btn" onclick="addEducation()">
                        + Add Education
                    </button>
                </section>

                <section>
                    <h2>Academic Achievements</h2>
                    <div id="achievementsList">
                        <div style="display:flex; gap:10px; margin-bottom:8px;">
                            <input type="text" placeholder="Achievement" class="ach-input" style="flex:1;">
                            <button type="button" onclick="this.parentElement.remove(); updatePreview();"
                                class="remove-btn" style="width:auto; padding:0 10px;">X</button>
                        </div>
                    </div>
                    <button type="button" class="add-btn" onclick="addAchievement()">
                        + Add Achievement
                    </button>
                </section>

                <section>
                    <h2>Other Projects</h2>
                    <div id="projectsList">
                        <div class="list-item project-item">
                            <input type="text" placeholder="Project Title" data-field="title" class="proj-input" />
                            <input type="text" placeholder="Date" data-field="date" class="proj-input" />
                            <textarea placeholder="Description" data-field="desc" class="proj-input"
                                rows="3"></textarea>
                        </div>
                    </div>
                    <button type="button" class="add-btn" onclick="addProject()">
                        + Add Project
                    </button>
                </section>

                <section>
                    <h2>Areas of Interest</h2>
                    <div id="interestsList">
                        <div style="display:flex; gap:10px; margin-bottom:8px;">
                            <input type="text" placeholder="Interest" class="int-input" style="flex:1;">
                            <button type="button" onclick="this.parentElement.remove(); updatePreview();"
                                class="remove-btn" style="width:auto; padding:0 10px;">X</button>
                        </div>
                    </div>
                    <button type="button" class="add-btn" onclick="addInterest()">
                        + Add Interest
                    </button>
                </section>

                <section>
                    <h2>Technical Skills and Certifications</h2>
                    <div class="grid-2" style="margin-bottom: 15px;">
                        <div class="input-group"><label>Programming Languages</label><input type="text"
                                id="inp-skills-prog" placeholder="C, C++, Python"></div>
                        <div class="input-group"><label>Engineering Software</label><input type="text"
                                id="inp-skills-eng" placeholder="VS Code, Git"></div>
                        <div class="input-group"><label>Other Software</label><input type="text" id="inp-skills-other">
                        </div>
                    </div>
                    <!-- NEW DYNAMIC SKILLS LIST -->
                    <div id="customSkillsList"></div>
                    <button type="button" class="add-btn" onclick="addCustomSkill()">+ Add Skill Category</button>
                </section>

                <section>
                    <h2>Positions of Responsibility</h2>
                    <div id="porList">
                        <div class="list-item por-item">
                            <input type="text" placeholder="Role" data-field="role" class="por-input" />
                            <input type="text" placeholder="Date" data-field="date" class="por-input" />
                            <textarea placeholder="Description" data-field="desc" class="por-input" rows="2"></textarea>
                        </div>
                    </div>
                    <button type="button" class="add-btn" onclick="addPOR()">
                        + Add Responsibility
                    </button>
                </section>

                <section>
                    <h2>Extracurricular Activities</h2>
                    <div id="extraActivitesList">
                        <div class="list-item extra-item">
                            <input type="text" data-field="category" class="ext-input"
                                placeholder="Category (e.g. Sport Activities:)" oninput="updatePreview()" />

                            <div class="desc-lines">
                                <div style="display:flex; gap:8px; margin-bottom:8px;">
                                    <input type="text" data-field="desc" class="ext-input"
                                        placeholder="Activity details..." style="flex:1;" oninput="updatePreview()" />
                                </div>
                            </div>

                            <div
                                style="display: flex; justify-content: space-between; align-items: center; margin-top: 5px;">
                                <button type="button" onclick="addExtraLine(this)"
                                    style="background:none; border:none; color:#3b82f6; cursor:pointer; font-size:0.9rem; font-weight: bold;">+
                                    Add Line</button>
                                <button type="button" onclick="this.closest('.list-item').remove(); updatePreview();"
                                    class="remove-btn" style="width:auto; margin:0; padding: 2px 5px;">
                                    <img src="./close.png" height="16">
                                </button>
                            </div>
                        </div>
                    </div>
                    <button type="button" class="add-btn" onclick="addExtracurricular()">
                        + Add Activity
                    </button>
                </section>
                <div style="display: flex;">
                    <button id="openAuthBtn" type="button" class="action-btn secondary-btn" style="display: none;">Cloud
                        Sync / Login</button>
                    <button type="button" class="submit-btn" id="generateBtn">
                        Print / Save PDF
                    </button>
                </div>
                <button type="button" class="add-btn" onclick="downloadJSON()" style="width: 100%; margin-top: 10px">
                    Download JSON
                </button>
            </form>
            <div id="status"></div>
        </div>

        <div class="resizer" id="dragMe">
            <div class="resizer-handle"></div>
        </div>

        <div class="preview-panel" id="rightPanel">
            <div id="resume-pages"></div>
        </div>
    </div>
    <script src="js/state.js?v=2"></script>
    <script src="js/ui.js?v=2"></script>
    <script src="js/preview.js?v=2"></script>
    <script src="js/auth.js?v=2"></script>
    <script src="js/data.js?v=2"></script>
    
</body>

</html>
